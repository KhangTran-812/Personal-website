<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Illustration of a synthetic ticket workflow through routing, approval, and audit history">
  <rect width="800" height="500" fill="#0b1322"/>
  <g stroke="#16233c" stroke-width="2" opacity=".8">
    <path d="M0 100h800M0 200h800M0 300h800M0 400h800"/>
    <path d="M100 0v500M200 0v500M300 0v500M400 0v500M500 0v500M600 0v500M700 0v500"/>
  </g>
  <g font-family="ui-monospace, Menlo, monospace">
    <rect x="28" y="24" width="228" height="34" rx="17" fill="#0c1322" stroke="#1c2841"/>
    <circle cx="48" cy="41" r="5" fill="#fbbf24"/>
    <text x="62" y="46" font-size="13" fill="#cbd5e1">SYNTHETIC LOCAL DEMO</text>
    <text x="28" y="100" font-size="14" fill="#64748b">SAMPLE SUPPORT TICKET · T-1042</text>
  </g>
  <g fill="none" stroke="#34d399" stroke-width="4" stroke-linecap="round">
    <path d="M178 240h55m150 0h55m150 0h55"/>
    <path d="m221 229 12 11-12 11m205-11 12 11-12 11m205-11 12 11-12 11"/>
  </g>
  <g font-family="ui-monospace, Menlo, monospace">
    <g>
      <rect x="28" y="160" width="150" height="160" rx="14" fill="#101c33" stroke="#263653"/>
      <rect x="48" y="184" width="42" height="28" rx="7" fill="#182941"/>
      <text x="57" y="203" font-size="12" fill="#93c5fd">API</text>
      <text x="48" y="244" font-size="15" font-weight="700" fill="#e6edf6">Ticket intake</text>
      <text x="48" y="270" font-size="12" fill="#9aa7bd">validate request</text>
      <text x="48" y="291" font-size="12" fill="#9aa7bd">stable replay key</text>
    </g>
    <g>
      <rect x="233" y="160" width="150" height="160" rx="14" fill="#101c33" stroke="#263653"/>
      <circle cx="258" cy="198" r="9" fill="#34d399"/>
      <text x="278" y="203" font-size="12" fill="#a7f3d0">ROUTE</text>
      <text x="253" y="244" font-size="15" font-weight="700" fill="#e6edf6">Assign queue</text>
      <text x="253" y="270" font-size="12" fill="#9aa7bd">priority + policy</text>
      <text x="253" y="291" font-size="12" fill="#9aa7bd">tenant scoped</text>
    </g>
    <g>
      <rect x="438" y="160" width="150" height="160" rx="14" fill="#101c33" stroke="#263653"/>
      <circle cx="463" cy="198" r="9" fill="#fbbf24"/>
      <text x="483" y="203" font-size="12" fill="#fde68a">HUMAN GATE</text>
      <text x="458" y="244" font-size="15" font-weight="700" fill="#e6edf6">Approval</text>
      <text x="458" y="270" font-size="12" fill="#9aa7bd">sensitive actions</text>
      <text x="458" y="291" font-size="12" fill="#9aa7bd">wait for decision</text>
    </g>
    <g>
      <rect x="643" y="160" width="129" height="160" rx="14" fill="#101c33" stroke="#263653"/>
      <path d="M668 187h30v34h-30z" fill="none" stroke="#38bdf8" stroke-width="2"/>
      <path d="m674 198 5 5 12-12m-17 19h18" fill="none" stroke="#38bdf8" stroke-width="2"/>
      <text x="663" y="244" font-size="15" font-weight="700" fill="#e6edf6">Execution</text>
      <text x="663" y="270" font-size="12" fill="#9aa7bd">history + audit</text>
      <text x="663" y="291" font-size="12" fill="#9aa7bd">recorded result</text>
    </g>
    <text x="28" y="384" font-size="12" fill="#64748b">Provider integrations are not exercised by this local demo.</text>
    <rect x="28" y="414" width="744" height="48" rx="10" fill="#0c1322" stroke="#1c2841"/>
    <circle cx="52" cy="438" r="5" fill="#34d399"/>
    <text x="68" y="443" font-size="12" fill="#9aa7bd">VALIDATED</text>
    <text x="160" y="443" font-size="12" fill="#e6edf6">routing</text>
    <text x="259" y="443" font-size="12" fill="#e6edf6">idempotent replay</text>
    <text x="435" y="443" font-size="12" fill="#e6edf6">tenant read boundary</text>
    <text x="640" y="443" font-size="12" fill="#64748b">local only</text>
